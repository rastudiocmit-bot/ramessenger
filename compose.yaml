name: center-messenger

services:
  db:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: center_messenger
      POSTGRES_USER: cm_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets:
      - db_owner_password
      - db_app_password
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/postgres/010-runtime-role.sh:/docker-entrypoint-initdb.d/010-runtime-role.sh:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm_owner -d center_messenger"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_wal_size=1GB"]
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    image: ${CM_IMAGE:-center-messenger:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      CM_ENVIRONMENT: production
      CM_DB_HOST: db
      CM_DB_NAME: center_messenger
      CM_DB_USER: cm_app
      CM_EXPECTED_DB_ROLE: cm_app
      CM_DB_PASSWORD_FILE: /run/secrets/db_app_password
      CM_PUBLIC_URL: ${CM_PUBLIC_URL:-https://messenger.rastudio.org}
      CM_BOOTSTRAP_TOKEN_FILE: /run/secrets/owner_bootstrap_token
      CM_CONNECTION_MASTER_KEY_FILE: /run/secrets/connection_master_key
      # Safe only with the loopback-published port and Nginx overwriting X-Real-IP.
      CM_TRUST_PROXY_IP: 'true'
      CM_CRM_SYNC_WORKER: 'true'
      CM_MAX_WORKER: 'true'
      CM_RUNTIME_ROLE: api
      CM_MAX_WORKER_KEY_FILE: /run/secrets/max_worker_key
      CM_TELEPHONY_WORKER_KEY_FILE: /run/secrets/telephony_worker_key
    secrets: [db_app_password, owner_bootstrap_token, connection_master_key, max_worker_key, telephony_worker_key]
    ports: ["127.0.0.1:8100:8000"]
    networks: [private]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 192
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  max-worker:
    # Pinned separately in the server .env. Ordinary API deployments neither
    # change this image nor recreate the service.
    image: ${CM_MAX_IMAGE:?A reviewed MAX worker image must be pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    command: ["uvicorn", "center_messenger.max_worker:app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--workers", "1", "--no-access-log", "--no-proxy-headers"]
    environment:
      CM_ENVIRONMENT: production
      CM_RUNTIME_ROLE: max
      CM_CRM_SYNC_WORKER: 'false'
      CM_MAX_WORKER: 'true'
      CM_DB_HOST: db
      CM_DB_NAME: center_messenger
      CM_DB_USER: cm_app
      CM_EXPECTED_DB_ROLE: cm_app
      CM_DB_PASSWORD_FILE: /run/secrets/db_app_password
      CM_DB_POOL_SIZE: '2'
      CM_DB_MAX_OVERFLOW: '1'
      CM_CONNECTION_MASTER_KEY_FILE: /run/secrets/connection_master_key
      CM_MAX_WORKER_KEY_FILE: /run/secrets/max_worker_key
      CM_PUBLIC_URL: ${CM_PUBLIC_URL:-https://messenger.rastudio.org}
    secrets: [db_app_password, connection_master_key, max_worker_key]
    networks: [private]
    # No host ports, Docker socket, source bind mounts or DB owner password.
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1024m
    cpus: 0.75
    pids_limit: 192
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  telephony-worker:
    # Pinned independently; ordinary API/MAX releases must not recreate it.
    image: ${CM_TELEPHONY_IMAGE:?A reviewed telephony image must be pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    command: ["uvicorn", "center_messenger.telephony_worker:app", "--factory", "--host", "0.0.0.0", "--port", "8002", "--workers", "1", "--no-access-log", "--no-proxy-headers"]
    environment:
      CM_ENVIRONMENT: production
      CM_RUNTIME_ROLE: telephony
      CM_CRM_SYNC_WORKER: 'false'
      CM_MAX_WORKER: 'false'
      CM_DB_HOST: db
      CM_DB_NAME: center_messenger
      CM_DB_USER: cm_app
      CM_EXPECTED_DB_ROLE: cm_app
      CM_DB_PASSWORD_FILE: /run/secrets/db_app_password
      CM_DB_POOL_SIZE: '2'
      CM_DB_MAX_OVERFLOW: '0'
      CM_CONNECTION_MASTER_KEY_FILE: /run/secrets/connection_master_key
      CM_TELEPHONY_WORKER_KEY_FILE: /run/secrets/telephony_worker_key
      CM_PUBLIC_URL: ${CM_PUBLIC_URL:-https://messenger.rastudio.org}
    secrets: [db_app_password, connection_master_key, telephony_worker_key]
    networks: [private]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 96
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    image: ${CM_IMAGE:-center-messenger:local}
    profiles: [tools]
    command: ["alembic", "upgrade", "head"]
    environment:
      CM_DB_HOST: db
      CM_DB_NAME: center_messenger
      CM_DB_USER: cm_owner
      CM_DB_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    networks: [private]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128

networks:
  private: {}

volumes:
  database: {}

secrets:
  telephony_worker_key:
    file: ./.secrets/telephony_worker_key
  max_worker_key:
    file: ./.secrets/max_worker_key
  db_owner_password:
    file: ./.secrets/db_owner_password
  db_app_password:
    file: ./.secrets/db_app_password
  owner_bootstrap_token:
    file: ./.secrets/owner_bootstrap_token
  connection_master_key:
    file: ${CM_KEY_DIR:-/opt/center-messenger-keys}/connection_master_key
