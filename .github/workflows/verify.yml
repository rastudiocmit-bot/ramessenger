name: Verify Center Messenger

on:
  pull_request:
    paths:
      - 'app/backend/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CM_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-test-password@127.0.0.1:5432/postgres
      PYTHONPATH: app/backend/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          npm ci --ignore-scripts
      - name: Python syntax
        run: python3 -m compileall -q app/backend/src app/backend/migrations scripts
      - name: Isolated message sync and deployment rollback tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Chat interface regression tests
        run: npm test
      - name: Validate Compose
        run: |
          mkdir -p .secrets
          touch .secrets/db_owner_password .secrets/db_app_password .secrets/owner_bootstrap_token
          mkdir -p /tmp/cm-workflow-placeholder
          touch /tmp/cm-workflow-placeholder/connection_master_key
          CM_KEY_DIR=/tmp/cm-workflow-placeholder docker compose config --quiet
      - name: Build image
        run: docker build --platform linux/amd64 -t center-messenger:verify .
      - name: Verify supervised sender in image
        run: |
          docker run --rm --network none --entrypoint /opt/venv/bin/python \
            -e PYTHONPATH=/app/backend/src:/tests \
            --mount "type=bind,source=$PWD/tests,target=/tests,readonly" \
            center-messenger:verify -c '
          import sys, unittest
          from center_messenger.native_send_runtime import runtime_supported
          assert runtime_supported(), "Native sender process isolation is unavailable"
          suite = unittest.defaultTestLoader.loadTestsFromName("test_native_send_runtime.NativeSendRuntimeTests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          '
      - name: Validate migration graph
        run: docker run --rm --entrypoint alembic center-messenger:verify -c /app/alembic.ini history

# This workflow intentionally NEVER deploys to the VPS.
# Deployment requires separately audited GitHub-to-VPS trust and a successful backup/restore test.
